name: Check

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-checks:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '24.14.1'
          cache: npm
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.13.9'
          architecture: x64
      - name: Install locked dependencies
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install -r packaging/requirements-runtime.txt
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "NIMDADESK_PYTHON=$((Get-Command python).Source)" >> $env:GITHUB_ENV
      - name: Check versions, types, architecture and tests
        run: npm run check
      - name: Verify application tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $manifest = Get-Content config/version.json -Raw | ConvertFrom-Json
          if ($env:GITHUB_REF_NAME -ne "v$($manifest.releases[0].version)") {
            throw 'Git tag does not match the application version.'
          }
      - name: Build frontend
        run: npm run build:web
