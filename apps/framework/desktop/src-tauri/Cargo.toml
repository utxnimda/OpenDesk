[package]
name = "opendesk"
version = "0.12.0"
description = "OpenDesk desktop framework"
edition = "2021"
rust-version = "1.85"

[lib]
name = "opendesk_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "sync", "time"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
zip = { version = "2.4", default-features = false, features = ["deflate"] }
rfd = { version = "0.15", default-features = false }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Threading"] }
